name: Verify Cinema
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npx --yes pnpm@11.1.3 install --frozen-lockfile
      - run: node --test apps/web/lib/__tests__/*.test.mjs
      - run: npx --yes pnpm@11.1.3 --filter @producer/core test
      - run: npx --yes pnpm@11.1.3 typecheck
      - run: npx --yes pnpm@11.1.3 --filter @producer/web build
